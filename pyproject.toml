[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fysiverse-3d-vision"
version = "0.1.0"
description = "Inference pipeline for automatic masks, object 3D assets, layout prediction, and GLB scene assembly"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1.0"
]

[project.scripts]
fysiverse-infer = "fysiverse.infer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/common.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
